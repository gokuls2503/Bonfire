# /etc/nginx/sites-available/bonfire
# Three server blocks: public site, admin SPA, API.
# Run `certbot --nginx -d bonfiregaminghub.com -d www.bonfiregaminghub.com \
#      -d admin.bonfiregaminghub.com -d api.bonfiregaminghub.com` after this is in place.

upstream bonfire_api {
    server 127.0.0.1:8001 fail_timeout=0;
}

# ---------- redirect apex www -> apex ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.bonfiregaminghub.com;
    return 301 https://bonfiregaminghub.com$request_uri;
}

# ---------- public site ----------
server {
    listen 80;
    listen [::]:80;
    server_name bonfiregaminghub.com;

    root /srv/bonfire/public-web;
    index index.html;

    access_log /var/log/nginx/bonfire-public.access.log;
    error_log  /var/log/nginx/bonfire-public.error.log;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router owns every path that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12M;
}

# ---------- admin SPA ----------
server {
    listen 80;
    listen [::]:80;
    server_name admin.bonfiregaminghub.com;

    root /srv/bonfire/admin-web;
    index index.html;

    access_log /var/log/nginx/bonfire-admin.access.log;
    error_log  /var/log/nginx/bonfire-admin.error.log;

    # Keep the console out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 12M;
}

# ---------- API + Django admin + media ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.bonfiregaminghub.com;

    access_log /var/log/nginx/bonfire-api.access.log;
    error_log  /var/log/nginx/bonfire-api.error.log;

    client_max_body_size 12M;

    location /static/ {
        alias /srv/bonfire/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/bonfire/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass         http://bonfire_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 60s;
    }
}
